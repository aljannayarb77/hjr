<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08261E" />
      <stop offset="100%" stop-color="#165644" />
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFC185" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#A48039" />
    </linearGradient>
  </defs>

  <!-- الخلفية -->
  <rect width="100" height="100" rx="22" fill="url(#gradEmerald)"/>

  <!-- الإطار الذهبي الداخلي -->
  <rect x="5" y="5" width="90" height="90" rx="18" fill="none" stroke="url(#gradGold)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- قوس المحراب المعماري المكي -->
  <path d="M 24 80 L 24 45 C 24 30, 76 30, 76 45 L 76 80" fill="none" stroke="url(#gradGold)" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- القوس الداخلي المنحني (حِجر إسماعيل) -->
  <path d="M 34 80 L 34 50 C 34 38, 66 38, 66 50 L 66 80" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 4"/>

  <!-- الهلال الإسلامي في أعلى المحراب -->
  <path d="M 50 18 A 6 6 0 1 0 54 28 A 5 5 0 1 1 50 18 Z" fill="url(#gradGold)"/>
</svg>
