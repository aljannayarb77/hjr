<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ماسح التذاكر والتحقق من QR | شاشة المنظمين</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0D3B2E">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    .scanner-box {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: #000000;
      box-shadow: var(--shadow-lg);
      position: relative;
    }
    #reader {
      width: 100%;
      min-height: 320px;
    }
    #reader video {
      border-radius: var(--radius-lg);
    }
    .scan-guide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 220px;
      border: 3px solid var(--gold);
      border-radius: 16px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4);
      pointer-events: none;
      z-index: 10;
    }
    .result-modal {
      display: none;
      margin-top: 24px;
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      animation: fadeIn 0.3s ease;
    }
    .result-valid {
      background: #ECFDF5;
      border: 2px solid #10B981;
    }
    .result-warning {
      background: #FFFBEB;
      border: 2px solid #F59E0B;
    }
    .result-danger {
      background: #FEF2F2;
      border: 2px solid #EF4444;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body style="background: #F1F4EE;">

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <nav class="navbar" style="height: 68px;">
        <div class="brand-logo" style="font-size: 1.15rem;">
          <div class="brand-icon" style="width: 38px; height: 38px;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7"/>
              <rect x="14" y="3" width="7" height="7"/>
              <rect x="14" y="14" width="7" height="7"/>
              <rect x="3" y="14" width="7" height="7"/>
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-title">ماسح دخول الحِجر</span>
            <span class="brand-subtitle" id="staff-welcome-text">بوابة المنظمين</span>
          </div>
        </div>

        <div class="nav-actions">
          <button id="btn-toggle-theme" class="btn btn-secondary btn-sm" title="تبديل المظهر">🌙 الوضع الداكن</button>
          <a href="admin.html" class="btn btn-secondary btn-sm">لوحة الإدارة</a>
          <button id="btn-staff-logout" class="btn btn-outline-gold btn-sm">خروج</button>
        </div>
      </nav>
    </div>
  </header>

  <main style="padding: 24px 0 60px;">
    <div class="container-sm">

      <!-- شريط حالة الماسح -->
      <div style="background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="width: 12px; height: 12px; border-radius: 50%; background: var(--success); display: inline-block;" id="camera-status-dot"></span>
          <strong style="color: var(--primary); font-size: 0.95rem;" id="camera-status-text">كاميرا المسح جاهزة</strong>
        </div>
        <div>
          <button type="button" id="btn-toggle-camera" class="btn btn-secondary btn-sm">
            إيقاف / تشغيل الكاميرا
          </button>
        </div>
      </div>

      <!-- مساحة مسح الكاميرا -->
      <div class="scanner-box">
        <div id="reader"></div>
        <div class="scan-guide" id="scan-guide-box"></div>
      </div>

      <!-- بديل: إدخال يدوي لرقم الحجز -->
      <div style="background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 18px 20px; margin-top: 20px;">
        <span style="font-size: 0.88rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 8px;">
          أو أدخل رقم الحجز يدويًا (في حال تعذر قراءة الرمز):
        </span>
        <div style="display: flex; gap: 10px;">
          <input type="text" id="manual-code-input" class="form-control" placeholder="مثال: HJ-2026-1001 أو رمز التوكن" style="font-weight: 700;">
          <button type="button" id="btn-manual-verify" class="btn btn-primary" style="flex-shrink: 0; padding: 0 20px;">
            تحقق
          </button>
        </div>
      </div>

      <!-- نتيجة التحقق (تظهر فور المسح) -->
      <div id="scan-result-card" class="result-modal">
        <!-- تملأ ديناميكياً -->
      </div>

    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/scanner.js"></script>
</body>
</html>
