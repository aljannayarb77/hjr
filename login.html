<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل دخول المنظمين والإدارة | مواعيد الحِجر</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0D3B2E">
</head>
<body style="background: #F8F9F5; display: flex; flex-direction: column; min-height: 100vh;">

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <nav class="navbar" style="height: 68px;">
        <a href="index.html" class="brand-logo" style="font-size: 1.15rem;">
          <div class="brand-icon" style="width: 38px; height: 38px;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 21V10a8 8 0 0 1 16 0v11"/>
              <path d="M9 21v-7a3 3 0 0 1 6 0v7"/>
            </svg>
          </div>
          <span>مواعيد الحِجر</span>
        </a>

        <div class="nav-actions">
          <button id="btn-toggle-theme" class="btn btn-secondary btn-sm" title="تبديل المظهر">🌙 الوضع الداكن</button>
          <a href="index.html" class="btn btn-secondary btn-sm">العودة للرئيسية</a>
        </div>
      </nav>
    </div>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px;">
    <div style="width: 100%; max-width: 440px;">
      
      <div class="booking-card" style="padding: 36px 28px;">
        <div style="text-align: center; margin-bottom: 28px;">
          <div style="width: 58px; height: 58px; background: var(--primary-subtle); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <h2 style="font-size: 1.6rem; color: var(--primary); margin-bottom: 6px;">بوابة الإدارة والتفويج</h2>
          <p style="color: var(--text-muted); font-size: 0.9rem;">تسجيل الدخول المخصص لمديري النظام وموظفي البوابات</p>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label for="username" class="form-label">اسم المستخدم أو البريد:</label>
            <input type="text" id="username" class="form-control" placeholder="admin أو staff" required autocomplete="username">
          </div>

          <div class="form-group">
            <label for="password" class="form-label">كلمة المرور:</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
          </div>

          <button type="submit" id="btn-login-submit" class="btn btn-primary btn-lg btn-block" style="margin-top: 24px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <polyline points="10 17 15 12 10 7"/>
              <line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
            <span>تسجيل الدخول</span>
          </button>
        </form>

        <!-- تعبئة سريعة للبيانات التجريبية -->
        <div style="margin-top: 28px; padding-top: 20px; border-top: 1px dashed var(--border); text-align: center;">
          <span style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 10px;">
            حسابات تجريبية للاختبار السريع:
          </span>
          <div style="display: flex; gap: 8px; justify-content: center;">
            <button type="button" id="btn-fill-admin" class="btn btn-secondary btn-sm" style="font-size: 0.82rem;">
              حساب المدير (admin)
            </button>
            <button type="button" id="btn-fill-staff" class="btn btn-secondary btn-sm" style="font-size: 0.82rem;">
              حساب الموظف (staff)
            </button>
          </div>
        </div>

      </div>

    </div>
  </main>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // تعبئة سريعة
      document.getElementById('btn-fill-admin').addEventListener('click', () => {
        document.getElementById('username').value = 'admin';
        document.getElementById('password').value = 'admin123';
      });

      document.getElementById('btn-fill-staff').addEventListener('click', () => {
        document.getElementById('username').value = 'staff';
        document.getElementById('password').value = 'staff123';
      });

      const form = document.getElementById('login-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const btn = document.getElementById('btn-login-submit');

        btn.disabled = true;
        btn.innerHTML = '<span>جاري التحقق...</span>';

        try {
          const res = await apiRequest('/auth/login', {
            method: 'POST',
            body: JSON.stringify({ username, password })
          });

          if (res.success && res.token) {
            localStorage.setItem('alhijr_auth_token', res.token);
            localStorage.setItem('alhijr_user', JSON.stringify(res.user));
            showToast('تم تسجيل الدخول بنجاح!', 'success');

            const params = new URLSearchParams(window.location.search);
            const redirect = params.get('redirect');

            setTimeout(() => {
              if (redirect) {
                window.location.href = redirect;
              } else if (res.user.role === 'STAFF') {
                window.location.href = 'scanner.html';
              } else {
                window.location.href = 'admin.html';
              }
            }, 500);
          }
        } catch (err) {
          showToast(err.message || 'بيانات الدخول غير صحيحة.', 'error');
          btn.disabled = false;
          btn.innerHTML = `<span>تسجيل الدخول</span>`;
        }
      });
    });
  </script>
</body>
</html>
